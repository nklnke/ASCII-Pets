<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }
  :root {
    --pet-scale: 1;
  }
  #stage .pet {
    position: absolute;
    left: 0;
    top: 24px;
    display: inline-block;
    margin: 0;
    padding: 8px;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: calc(15px * var(--pet-scale));
    line-height: 1.15;
    color: #fff;
    text-shadow: 0 0 4px #000, 1px 1px 0 #000;
    cursor: pointer;
    white-space: pre;
    /* transform is rewritten every walk tick; transition turns 33ms steps
       into smooth gliding + soft bobbing/jump arcs. Ink color transitions
       keep auto-inversion from flashing on every sample. */
    transition: transform 120ms linear, color 300ms linear, text-shadow 300ms linear;
  }
  #stage .pet.dragging {
    transition: none;
  }
  /* Per-glyph ink: each symbol carries its own inverted color. */
  #stage .pet span {
    transition: color 300ms linear, text-shadow 300ms linear;
  }
  #msg {
    font-family: Consolas, monospace;
    font-size: 12px;
    color: #ffd97a;
    text-shadow: 1px 1px 0 #000;
    padding: 0 8px;
    min-height: 16px;
  }
  #stats {
    font-family: Consolas, monospace;
    font-size: 11px;
    color: #9ad7ff;
    text-shadow: 1px 1px 0 #000;
    padding: 0 8px;
    min-height: 15px;
    opacity: 0.9;
    white-space: pre-line;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg"></div>
<div id="stats"></div>
<script src="./renderer.js"></script>
</body>
</html>
