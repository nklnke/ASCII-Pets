<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }
  :root {
    --pet-scale: 1;
  }
  #stage .pet {
    position: absolute;
    left: 0;
    /* Bottom-anchored flush with the window bottom (= the taskbar's top
       edge): skins keep native heights (cat 4, dog 6, frog 4) and still
       stand on one ground line. Vertical motion (jump/bob) is translateY
       on top of this anchor. */
    bottom: 0;
    display: inline-block;
    margin: 0;
    padding: 8px 8px 0;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: calc(15px * var(--pet-scale));
    line-height: 1.15;
    color: #fff;
    text-shadow: 0 0 4px #000, 1px 1px 0 #000;
    cursor: pointer;
    white-space: pre;
    /* Position is written every animation frame (rAF, dt-based): no transform
       transition, so the compositor never chases a moving target (judder +
       ghost trails on transparent windows). Ink transitions stay so
       auto-inversion fades instead of flashing on every sample. */
    transition: color 300ms linear, text-shadow 300ms linear;
    will-change: transform;
  }
  /* Poop pile: the wrap is floor-anchored (bottom: 0 = taskbar top edge),
     the pile sits on the ground line, grey stink waves curl above it.
     Fixed inks — no per-cell inversion for the pile. */
  #stage .poop-wrap {
    position: absolute;
    left: 0;
    bottom: 0;
    margin: 0;
    padding: 8px 8px 0;
    cursor: pointer;
    opacity: 1;
    /* Opacity only: the wrap carries an inline translateX for positioning,
       so a class-based transform would fight it. */
    transition: opacity 150ms linear;
  }
  #stage .poop-wrap.poop-enter,
  #stage .poop-wrap.poop-leaving {
    opacity: 0;
  }
  #stage .poop {
    margin: 0;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: calc(15px * var(--pet-scale));
    line-height: 1.15;
    color: #c98a4b;
    text-shadow: 0 0 4px #000, 1px 1px 0 #000;
    white-space: pre;
  }
  #stage .stink {
    margin: 0;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: calc(15px * var(--pet-scale));
    line-height: 1.15;
    color: #8f8f9a;
    text-shadow: 0 0 4px #000, 1px 1px 0 #000;
    white-space: pre;
  }
  /* Pixel style (ascii3): one shared silhouette for the pile + waves. */
  #stage .poop-wrap.flat {
    filter: drop-shadow(1px 1px 0 #000);
  }
  #stage .poop-wrap.flat .poop,
  #stage .poop-wrap.flat .stink {
    text-shadow: none;
  }
  /* Pixel style (ascii3): glyphs fuse into one blob, so per-glyph
     text-shadow turns to mud — one shared silhouette instead. */
  #stage .pet.flat {
    text-shadow: none;
    filter: drop-shadow(1px 1px 0 #000);
  }
  /* Floating music notes: pop above the head, drift up, fade out.
     pointer-events:none keeps the click-through contract intact. */
  #stage .note {
    position: absolute;
    margin: 0;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: calc(18px * var(--pet-scale));
    line-height: 1;
    color: #ffd97a;
    text-shadow: 0 0 4px #000, 1px 1px 0 #000;
    white-space: pre;
    pointer-events: none;
    animation: note-float 1.2s ease-out forwards;
  }
  @keyframes note-float {
    from { opacity: 0; transform: translateY(0) scale(0.7); }
    15% { opacity: 1; }
    to { opacity: 0; transform: translateY(-56px) scale(1.1); }
  }
  #stage .pet.flat span {
    text-shadow: none;
  }
  /* Per-glyph ink: each symbol carries its own inverted color. */
  #stage .pet span {
    transition: color 300ms linear, text-shadow 300ms linear;
  }
</style>
</head>
<body>
<div id="stage"></div>
<script src="./renderer.js"></script>
</body>
</html>
